services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim_aset_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: it_asset_db
      DB_USERNAME: asset_user
      DB_PASSWORD: asset_secret_password
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - sim_aset_net

  web:
    image: nginx:alpine
    container_name: sim_aset_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sim_aset_net

  db:
    image: mysql:8.0
    container_name: sim_aset_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: it_asset_db
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_USER: asset_user
      MYSQL_PASSWORD: asset_secret_password
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sim_aset_net

networks:
  sim_aset_net:
    driver: bridge

volumes:
  mysql_data:

